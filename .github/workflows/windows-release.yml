name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck and unit tests
        run: |
          npm run typecheck
          npm test -- --reporter=dot

      - name: Build Windows installer
        run: npm run dist:win

      - name: Smoke-test packaged application
        run: npm run test:packaged -- release/win-unpacked/WorkLens.exe

      - name: Verify silent installation and write checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/WorkLens-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'WorkLensInstalled'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)." }
          $installedApp = Join-Path $installDir 'WorkLens.exe'
          if (-not (Test-Path $installedApp)) { throw 'Installed WorkLens.exe was not found.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content release/SHA256SUMS-windows.txt -Encoding ascii
          $uninstaller = Join-Path $installDir 'Uninstall WorkLens.exe'
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WorkLens-Windows-x64
          path: |
            release/WorkLens-Setup-*.exe
            release/SHA256SUMS-windows.txt
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WorkLens-Windows-x64
          path: release

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $installer = Get-ChildItem release/WorkLens-Setup-*.exe | Select-Object -First 1
          $checksum = Resolve-Path release/SHA256SUMS-windows.txt
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $installer.FullName $checksum --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $installer.FullName $checksum --verify-tag --generate-notes --title "WorkLens $env:GITHUB_REF_NAME"
          }
